
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaFlow | Login</title>
  <link rel="stylesheet" href="login_style.css">
</head>
<body>

  <div class="background-glow glow-one"></div>
  <div class="background-glow glow-two"></div>

  <main class="auth-container">
    <section class="brand-panel">
      <div class="brand-icon">〰</div>
      <p class="eyebrow">WELCOME TO</p>
      <h1>Aqua<span>Flow</span></h1>
      <p class="brand-description">
        Explore a smoother digital experience.
        Your journey starts here.
      </p>

      <div class="water-orb orb-one"></div>
      <div class="water-orb orb-two"></div>

      <p class="brand-footer">FLOW INTO YOUR WORLD</p>
    </section>

    <section class="form-panel">
      <div class="mobile-brand">〰</div>

      <div class="form-heading">
        <p class="eyebrow">HELLO</p>
        <h2 id="formTitle">Welcome </h2>
        <p id="formSubtitle"></p>
      </div>

      <div class="tab-buttons">
        <button type="button" class="tab active" id="loginTab">
          Login
        </button>
        <button type="button" class="tab" id="signupTab">
          Sign Up
        </button>
      </div>

      <p class="message" id="message" role="status" aria-live="polite"></p>

      <!-- LOGIN FORM -->
      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="Enter your email address"
            autocomplete=""
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="show-password"
              data-target="loginPassword">Show</button>
          </div>
        </div>

        <button type="submit" class="submit-button">
          Login to Account <span>→</span>
        </button>

        <p class="switch-text">
          Don't have an account?
          <button type="button" class="text-button" id="goSignup">
            Sign Up
          </button>
        </p>
      </form>

      <!-- SIGN UP FORM -->
      <form id="signupForm" autocomplete="on" hidden>
        <div class="form-group">
          <label for="signupName">Full name</label>
          <input
            type="text"
            id="signupName"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            minlength="2"
            required
          >
        </div>

        <div class="form-group">
          <label for="signupEmail">Email address</label>
          <input
            type="email"
            id="signupEmail"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="signupPassword">Create password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="signupPassword"
              name="password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              minlength="6"
              required
            >
            <button type="button" class="show-password"
              data-target="signupPassword">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Enter your password again"
              autocomplete="new-password"
              minlength="6"
              required
            >
            <button type="button" class="show-password"
              data-target="confirmPassword">Show</button>
          </div>
        </div>

        <button type="submit" class="submit-button">
          Create Account <span>→</span>
        </button>

        <p class="switch-text">
          Already have an account?
          <button type="button" class="text-button" id="goLogin">
            Log in
          </button>
        </p>
      </form>

      <p class="security-note">
        
      </p>
    </section>
  </main>

  <script>
    "use strict";

    const ACCOUNT_KEY = "waterSiteAccounts";
    const USER_KEY = "waterSiteUser";
    const EMAIL_KEY = "waterSiteEmail";
    const NAME_KEY = "waterSiteName";

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const message = document.getElementById("message");

    function readAccounts() {
      try {
        const saved = JSON.parse(localStorage.getItem(ACCOUNT_KEY) || "[]");

        if (!Array.isArray(saved)) return [];

        // Remove the old sample account from the previous version.
        const accounts = saved.filter(account =>
          account &&
          typeof account.email === "string" &&
          account.email.trim().toLowerCase() !== "demo@aquaflow.com"
        );

        localStorage.setItem(ACCOUNT_KEY, JSON.stringify(accounts));
        return accounts;
      } catch (error) {
        return [];
      }
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function showLogin() {
      loginForm.hidden = false;
      signupForm.hidden = true;

      loginTab.classList.add("active");
      signupTab.classList.remove("active");

      formTitle.textContent = "Welcome back";
      formSubtitle.textContent = "Log in to continue your journey.";
      clearMessage();
    }

    function showSignup() {
      loginForm.hidden = true;
      signupForm.hidden = false;

      signupTab.classList.add("active");
      loginTab.classList.remove("active");

      formTitle.textContent = "Create account";
      formSubtitle.textContent = "Join AquaFlow and get started.";
      clearMessage();
    }

    loginTab.addEventListener("click", showLogin);
    signupTab.addEventListener("click", showSignup);
    document.getElementById("goSignup").addEventListener("click", showSignup);
    document.getElementById("goLogin").addEventListener("click", showLogin);

    document.querySelectorAll(".show-password").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        if (!input) return;

        const shouldShow = input.type === "password";
        input.type = shouldShow ? "text" : "password";
        button.textContent = shouldShow ? "Hide" : "Show";
      });
    });

    // SIGN UP: save the user's own account.
    signupForm.addEventListener("submit", event => {
      event.preventDefault();
      clearMessage();

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim().toLowerCase();
      const password = document.getElementById("signupPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (name.length < 2) {
        showMessage("Please enter your full name.", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("Your password must be at least 6 characters.", "error");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      const accounts = readAccounts();
      const emailExists = accounts.some(account =>
        account.email.trim().toLowerCase() === email
      );

      if (emailExists) {
        showMessage("This email is already registered. Please log in.", "error");
        return;
      }

      accounts.push({
        name: name,
        email: email,
        password: password
      });

      try {
        localStorage.setItem(ACCOUNT_KEY, JSON.stringify(accounts));
      } catch (error) {
        showMessage("Unable to save your account in this browser.", "error");
        return;
      }

      signupForm.reset();
      document.getElementById("loginEmail").value = email;
      showLogin();
      showMessage("Account created! You can now log in with your email and password.", "success");
    });

    // LOGIN: allow only accounts that have been registered.
    loginForm.addEventListener("submit", event => {
      event.preventDefault();
      clearMessage();

      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      const accounts = readAccounts();
      const account = accounts.find(item =>
        item.email.trim().toLowerCase() === email &&
        item.password === password
      );

      if (!account) {
        showMessage("Incorrect email or password. Please sign up first if you don't have an account.", "error");
        return;
      }

      try {
        localStorage.setItem(USER_KEY, account.email);
        localStorage.setItem(EMAIL_KEY, account.email);
        localStorage.setItem(NAME_KEY, account.name);

        showMessage("Login successful! Opening your account...", "success");

        setTimeout(() => {
          window.location.href = "./index.html";
        }, 500);
      } catch (error) {
        showMessage("Unable to save your login session in this browser.", "error");
      }
    });
  </script>

</body>
</html>
